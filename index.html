<td style="padding:4px;border:1px solid #0066cc;color:#6b7280">—</td>
<td style="padding:4px;border:1px solid #0066cc;color:#6b7280">—</td>
<td style="padding:4px;border:1px solid #0066cc;color:#6b7280">—</td>
<td style="padding:4px;border:1px solid #0066cc;color:#a78bfa">VULCAN</td>
<td style="padding:4px;border:1px solid #0066cc;color:#a78bfa;animation:vul 3s ease-in-out infinite">🖖 monitoring…</td>
</tr>
</table>
</div>
<div id="k2v-w" style="margin-top:4px;font-size:16px;color:#8b949e"></div>
<div id="k2v-dx" style="margin-top:8px;padding-top:6px;border-top:1px solid rgba(0,102,204,0.25);font-size:16px;color:#8b949e">
<b style="color:#f0c040">🎯 DX WATCH — HEARD NEAR FM18:</b>
<div id="k2v-dxlist" style="margin-top:4px"></div>
</div>
<div style="margin-top:8px;padding-top:6px;border-top:1px solid rgba(0,102,204,0.25);font-size:16px;color:#8b949e">
<span style="color:#3399ff">🖖 NCC-1701</span> ·

Ticonderoga, NY ·
<a href="https://www.facebook.com/StarTrekTour/" style="color:#3498db;text-decoration:none" target="_blank">Facebook</a> ·
<span style="color:#50fa7b">✦ Galileo shuttlecraft now on display</span>
</div>
</div>
<script>
(function(){
var W=[
{c:1,n:"Antarctica",r:"OC"},{c:176,n:"New Zealand",r:"OC"},{c:200,n:"Australia",r:"OC"},{c:237,n:"Fiji",r:"OC"},{c:251,n:"Kiribati",r:"OC"},{c:234,n:"FSM",r:"OC"},{c:308,n:"Marshall Is.",r:"OC"},{c:312,n:"Nauru",r:"OC"},{c:318,n:"Palau",r:"OC"},{c:344,n:"Samoa",r:"OC"},{c:347,n:"Solomon Is.",r:"OC"},{c:348,n:"PNG",r:"OC"},{c:350,n:"Tonga",r:"OC"},{c:351,n:"Tuvalu",r:"OC"},{c:352,n:"Vanuatu",r:"OC"},{c:354,n:"Timor-Leste",r:"OC"},
{c:240,n:"Hong Kong",r:"AS"},{c:281,n:"Cambodia",r:"AS"},{c:284,n:"Brunei",r:"AS"},{c:289,n:"Bangladesh",r:"AS"},{c:291,n:"S. Korea",r:"AS"},{c:292,n:"N. Korea",r:"AS"},{c:293,n:"Japan",r:"AS"},{c:294,n:"Philippines",r:"AS"},{c:295,n:"Thailand",r:"AS"},{c:296,n:"Vietnam",r:"AS"},{c:297,n:"Indonesia",r:"AS"},{c:298,n:"Malaysia",r:"AS"},{c:299,n:"Nepal",r:"AS"},{c:300,n:"Sri Lanka",r:"AS"},{c:305,n:"Mongolia",r:"AS"},{c:307,n:"Myanmar",r:"AS"},{c:310,n:"India",r:"AS"},{c:315,n:"Pakistan",r:"AS"},{c:342,n:"Taiwan",r:"AS"},{c:345,n:"Singapore",r:"AS"},{c:256,n:"Laos",r:"AS"},
{c:227,n:"Algeria",r:"AF"},{c:230,n:"Egypt",r:"AF"},{c:257,n:"Libya",r:"AF"},{c:306,n:"Morocco",r:"AF"},{c:353,n:"Tunisia",r:"AF"},{c:413,n:"São Tomé",r:"AF"},{c:423,n:"South Africa",r:"AF"},{c:424,n:"Tanzania",r:"AF"},{c:425,n:"Uganda",r:"AF"},{c:426,n:"Kenya",r:"AF"},{c:427,n:"Sudan",r:"AF"},{c:428,n:"Zambia",r:"AF"},{c:429,n:"Gambia",r:"AF"},{c:430,n:"Lesotho",r:"AF"},{c:431,n:"Rwanda",r:"AF"},{c:432,n:"Mauritius",r:"AF"},{c:433,n:"Madagascar",r:"AF"},{c:434,n:"Comoros",r:"AF"},{c:435,n:"Reunion",r:"AF"},{c:436,n:"Seychelles",r:"AF"},{c:437,n:"Mozambique",r:"AF"},{c:438,n:"Zimbabwe",r:"AF"},{c:439,n:"Botswana",r:"AF"},{c:440,n:"Namibia",r:"AF"},{c:441,n:"Angola",r:"AF"},{c:442,n:"Congo",r:"AF"},{c:443,n:"DR Congo",r:"AF"},{c:444,n:"Ethiopia",r:"AF"},{c:445,n:"Eritrea",r:"AF"},{c:446,n:"Somalia",r:"AF"},{c:447,n:"Djibouti",r:"AF"},{c:448,n:"Guinea",r:"AF"},{c:449,n:"Ivory Coast",r:"AF"},{c:450,n:"Ghana",r:"AF"},{c:451,n:"Nigeria",r:"AF"},{c:452,n:"Cameroon",r:"AF"},{c:453,n:"Gabon",r:"AF"},{c:454,n:"Eq. Guinea",r:"AF"},{c:455,n:"C. African Rep",r:"AF"},{c:456,n:"Chad",r:"AF"},{c:457,n:"Mali",r:"AF"},{c:458,n:"Niger",r:"AF"},{c:459,n:"Burkina Faso",r:"AF"},{c:460,n:"Senegal",r:"AF"},{c:461,n:"Mauritania",r:"AF"},{c:462,n:"Togo",r:"AF"},{c:463,n:"Benin",r:"AF"},{c:464,n:"Liberia",r:"AF"},{c:465,n:"Sierra Leone",r:"AF"},{c:466,n:"Guinea-Bissau",r:"AF"},{c:467,n:"Cape Verde",r:"AF"},{c:468,n:"St Helena",r:"AF"},
{c:268,n:"Greenland",r:"NA"}
];
var BM={6:"6m",10:"10m",12:"12m",15:"15m",17:"17m",20:"20m",30:"30m",40:"40m"};
var RC={AS:"#f0c040",AF:"#50fa7b",OC:"#bd93f9",NA:"#ff6b6b"};

/* ===== DX WATCH LIST — edit this array to track specific DX callsigns ===== */
var DXW=[
{call:"7P8GE",name:"Lesotho"},
{call:"C5R",name:"Gambia"},
{call:"9N7XT",name:"Nepal"},
{call:"H44MS",name:"Solomon Is."}
];
/* ===== END DX WATCH LIST ===== */

var nextDelay=120000;
var dxDelay=300000;

function pollMain(){
fetch("https://corsproxy.io/?https://pskreporter.info/pskreporter?callsign=K2VG&flowStartSeconds=-900&mode=FT8")
.then(function(r){
if(r.status===429){nextDelay=300000;document.getElementById("k2v-t").textContent="Rate limited — retrying in 5 min";setTimeout(pollMain,nextDelay);return null}
return r.text()
})
.then(function(d){
if(!d)return;
if(d.trim().length<50){nextDelay=300000;setTimeout(pollMain,nextDelay);return}
nextDelay=120000;
var x=new DOMParser().parseFromString(d,"text/xml");
var sp=x.querySelectorAll("spot");
var tbl=document.getElementById("k2v-tbl");
var rows=tbl.querySelectorAll("tr");
for(var i=rows.length-1;i>2;i--)tbl.deleteRow(i);
var bc={};var hits=[];
sp.forEach(function(s){
var b=s.querySelector("band")?s.querySelector("band").textContent:"";
var c=s.querySelector("call")?s.querySelector("call").textContent:"";
var g=s.querySelector("grid")?s.querySelector("grid").textContent:"";
var snr=parseFloat(s.querySelector("snr")?s.querySelector("snr").textContent:"0");
var dx=s.querySelector("dxcc")?parseInt(s.querySelector("dxcc").textContent):0;
if(!BM[b])return;
bc[b]=(bc[b]||0)+1;
var w=W.find(function(w){return w.c===dx});
var reg=w?w.r:"";
var row=tbl.insertRow();
row.innerHTML='<td style="padding:4px;border:1px solid #0066cc">'+c+'</td><td style="padding:4px;border:1px solid #0066cc">'+g+'</td><td style="padding:4px;border:1px solid #0066cc">'+b+'</td><td style="padding:4px;border:1px solid #0066cc;color:'+(snr<=-15?"#f0c040":"#c9d1d9")+'">'+snr.toFixed(1)+'</td><td style="padding:4px;border:1px solid #0066cc">'+dx+'</td><td style="padding:4px;border:1px solid #0066cc;color:'+(RC[reg]||"#8b949e")+'">'+reg+'</td>';
if(reg&&snr<=-15)hits.push(c+" "+b+" "+snr+"dB "+(w?w.n:""));
});
var bd=Object.keys(bc).map(function(b){return b+"("+bc[b]+")"}).join(" ");
document.getElementById("k2v-b").textContent="Bands: "+(bd||"none active");
if(!sp.length){document.getElementById("k2v-w").innerHTML='<div style="text-align:center;padding:20px 0;color:#8b949e">📡 Waiting for FT8 spots…</div>'}
else{document.getElementById("k2v-w").innerHTML=hits.length?'<b style="color:#f0c040">⚡ ≤-15dB targets:</b> '+hits.slice(0,5).join(" | "):"No ≤-15dB AS/AF/OC targets in last 15 min"}
document.getElementById("k2v-t").textContent=new Date().toLocaleTimeString()+" · "+sp.length+" spots";
setTimeout(pollMain,nextDelay);
})
.catch(function(e){nextDelay=300000;setTimeout(pollMain,nextDelay)});
}

function pollDX(){
var el=document.getElementById("k2v-dxlist");
var results=[];
var done=0;
DXW.forEach(function(dx){
fetch("https://corsproxy.io/?https://pskreporter.info/pskreporter?callsign="+dx.call+"&flowStartSeconds=-900&mode=FT8")
.then(function(r){return r.text()})
.then(function(d){
var x=new DOMParser().parseFromString(d,"text/xml");
var sp=x.querySelectorAll("spot");
sp.forEach(function(s){
var rc=s.querySelector("rc")?s.querySelector("rc").textContent:"";
var rg=s.querySelector("rg")?s.querySelector("rg").textContent:"";
var b=s.querySelector("band")?s.querySelector("band").textContent:"";
var snr=parseFloat(s.querySelector("snr")?s.querySelector("snr").textContent:"0");
var f=s.querySelector("f")?s.querySelector("f").textContent:"";
if(rg&&rg.indexOf("FM")===0&&BM[b]){
results.push({call:dx.call,name:dx.name,rc:rc,rg:rg,band:b,snr:snr,freq:(f/1000000).toFixed(3)});
}
});
done++;
if(done===DXW.length){renderDX();setTimeout(pollDX,dxDelay)}
})
.catch(function(){done++;if(done===DXW.length){renderDX();setTimeout(pollDX,dxDelay)}});
});
function renderDX(){
if(!results.length){el.innerHTML='<span style="color:#8b949e">No DX watch targets heard near FM18 in last 15 min</span>';return}
results.sort(function(a,b){return b.snr-a.snr});
var h="";
results.slice(0,8).forEach(function(r){
h+='<div style="margin:2px 0"><b style="color:#f0c040">'+r.call+'</b> <span style="color:#c9d1d9">('+r.name+')</span> — heard by <b>'+r.rc+'</b> <span style="color:#8b949e">('+r.rg+')</span> on <b style="color:#50fa7b">'+r.band+' '+r.freq+' MHz</b> @ <span style="color:'+(r.snr<=-15?"#f0c040":"#c9d1d9")+'">'+r.snr.toFixed(1)+' dB</span></div>';
});
el.innerHTML=h;
}
}

pollMain();
pollDX();
})();
</script>
</body></html>
