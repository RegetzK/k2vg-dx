function poll(){
fetch("https://pskreporter.info/pskreporter?callsign=K2VG&flowStartSeconds=-900&mode=FT8")
.then(function(r){return r.text()})
.then(function(d){
var x=new DOMParser().parseFromString(d,"text/xml");
var sp=x.querySelectorAll("spot");
var tbl=document.getElementById("k2v-tbl");
var rows=tbl.querySelectorAll("tr");
for(var i=rows.length-1;i>0;i--)tbl.deleteRow(i);
var bc={};var hits=[];
sp.forEach(function(s){
var b=s.querySelector("band")?s.querySelector("band").textContent:"";
var c=s.querySelector("call")?s.querySelector("call").textContent:"";
var g=s.querySelector("grid")?s.querySelector("grid").textContent:"";
var snr=parseFloat(s.querySelector("snr")?s.querySelector("snr").textContent:"0");
var dx=s.querySelector("dxcc")?parseInt(s.querySelector("dxcc").textContent):0;
if(!BM[b])return;
bc[b]=(bc[b]||0)+1;
var w=W.find(function(w){return w.c===dx});
var reg=w?w.r:"";
var row=tbl.insertRow();
row.innerHTML='<td style="padding:1px 2px">'+c+'</td><td>'+g+'</td><td>'+b+'</td><td style="color:'+(snr<=-15?"#f0c040":"#c9d1d9")+'">'+snr.toFixed(1)+'</td><td>'+dx+'</td><td style="color:'+(RC[reg]||"#8b949e")+'">'+reg+'</td>';
if(reg&&snr<=-15)hits.push(c+" "+b+" "+snr+"dB "+(w?w.n:""));
});
document.getElementById("k2v-b").textContent="Bands: "+Object.keys(bc).map(function(b){return b+"("+bc[b]+")"}).join(" ")||"none active";
document.getElementById("k2v-t").textContent=new Date().toLocaleTimeString()+" · "+sp.length+" spots";
document.getElementById("k2v-w").innerHTML=hits.length?'<b style="color:#f0c040">⚡ ≤-15dB targets:</b> '+hits.slice(0,5).join(" | "):"No ≤-15dB AS/AF/OC targets in last 15 min";
})
.catch(function(e){document.getElementById("k2v-t").textContent="API error: "+e.message});
setTimeout(poll,300000);
}
poll();
})();
