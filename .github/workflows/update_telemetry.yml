name: Update Subspace Telemetry Array
on:
  schedule:
    - cron: '*/15 * * * *' # Auto-fires the array script every 15 minutes
  workflow_dispatch: # Forces the grey manual override button to appear

jobs:
  refresh-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Mission Deck
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Runtime Dependencies
        run: pip install requests

      - name: Fire Telemetry Parser
        run: python proxy/fetch_telemetry.py

      - name: Secure Data Push to GitHub Pages
        run: |
          git config --global user.name "Beta-5-Processor"
          git config --global user.email "[email protected]"
          git add docs/data/telemetry.json
          git diff-index --quiet HEAD || git commit -m "Telemetry Update: $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
          git push
