name: BETA 5 Telemetry Update

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telemetry-update
  cancel-in-progress: true

jobs:
  update-telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean working tree
        run: git checkout -- .

      - name: Sync with remote
        run: |
          git config user.name "BETA 5"
          git config user.email "beta5@k2vg.local"
          git pull --rebase origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch telemetry
        timeout-minutes: 4
        run: python proxy/fetch_telemetry.py

      - name: Validate telemetry
        run: python -c "import json; d=json.load(open('data/telemetry.json')); print('OK:', len(d), 'keys')"

      - name: Upload telemetry artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-json
          path: data/telemetry.json
          retention-days: 3

      - name: Commit and push
        run: |
          git add data/telemetry.json
          git diff --cached --quiet || git commit -m "Telemetry update $(date -u +%Y%m%dT%H%M%SZ)"
          git push   
