name: BETA 5 Telemetry Update

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch telemetry
        run: python proxy/fetch_telemetry.py

      - name: Commit and push
        run: |
          git config user.name "BETA 5"
          git config user.email "beta5@k2vg.local"
          git remote set-url origin https://x-access-token:${{ secrets.yaml_workflow_telemetry_v1 }}@github.com/${{ github.repository }}   
          git add data/telemetry.json
          git diff --cached --quiet || git commit -m "Telemetry update $(date -u +%Y%m%dT%H%M%SZ)"
          git push   
