<!-- COL 1: RED ALERT LEFT -->
<td style="padding:0 3px 8px 3px;text-align:center;vertical-align:top;width:70px">
<div class="red-alert-panel" style="box-sizing:border-box;border:2.7px solid #999;border-radius:1px;height:65px;margin:0 auto;width:25px;position:relative;background:transparent;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06), inset 0 -1px 0 rgba(0,0,0,0.2)">

  <!-- Lit reeded glass: warm bulb hotspots bleeding through red tint -->
  <div style="position:absolute;top:0;left:0;width:100%;height:100%;background:
    radial-gradient(ellipse 18px 13px at 50% 100%, rgba(255,205,120,0.95) 0%, rgba(255,120,40,0.55) 22%, transparent 70%),
    radial-gradient(ellipse 18px 13px at 50% 62%,  rgba(255,205,120,0.95) 0%, rgba(255,120,40,0.55) 22%, transparent 70%),
    radial-gradient(ellipse 18px 13px at 50% 24%,  rgba(255,205,120,0.95) 0%, rgba(255,120,40,0.55) 22%, transparent 70%),
    linear-gradient(180deg, #d8261e 0%, #8a1209 100%);
    animation:redFlash 1s infinite ease-in-out;
    box-shadow:inset 0 0 10px rgba(255,0,0,0.5)"></div>

  <!-- Vertical reeding (fluted glass) -->
  <div style="position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(90deg, transparent 0px, transparent 3px, rgba(255,255,255,0.08) 3px, rgba(255,255,255,0.08) 4px);z-index:1;pointer-events:none"></div>

  <!-- Horizontal reed shadows for depth -->
  <div style="position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg, transparent 0px, transparent 3px, rgba(0,0,0,0.14) 3px, rgba(0,0,0,0.14) 4px);z-index:1;pointer-events:none"></div>

  <!-- Top-edge surface glare -->
  <div style="position:absolute;top:0;left:0;width:100%;height:30%;background:linear-gradient(180deg, rgba(255,255,255,0.10) 0%, transparent 100%);z-index:1;pointer-events:none"></div>

  <!-- Indicator pips (unchanged) -->
  <span style="position:absolute;left:50%;top:4px;width:4px;height:5px;background:#E0115F;box-shadow:0 0 6px #E0115F,0 0 12px #ff4444;transform:translateX(-50%);z-index:2"></span>
  <span style="position:absolute;left:50%;top:9px;width:4px;height:5px;background:#C21E56;box-shadow:0 0 6px #C21E56,0 0 12px #ff4444;transform:translateX(-50%);z-index:2"></span>
  <span style="position:absolute;left:50%;top:25px;width:4px;height:5px;background:#E0115F;box-shadow:0 0 6px #E0115F,0 0 12px #ff4444;transform:translateX(-50%);z-index:2"></span>
  <span style="position:absolute;left:50%;top:30px;width:4px;height:5px;background:#C21E56;box-shadow:0 0 6px #C21E56,0 0 12px #ff4444;transform:translateX(-50%);z-index:2"></span>
  <span style="position:absolute;left:50%;top:46px;width:4px;height:5px;background:#E0115F;box-shadow:0 0 6px #E0115F,0 0 12px #ff4444;transform:translateX(-50%);z-index:2"></span>
  <span style="position:absolute;left:50%;top:51px;width:4px;height:5px;background:#C21E56;box-shadow:0 0 6px #C21E56,0 0 12px #ff4444;transform:translateX(-50%);z-index:2"></span>

</div>
</td>
